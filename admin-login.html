<!DOCTYPE html><html lang="hi">
<head>

</head><body class="admin-page"><div class="support-bar">

<main class="dashboard">

        <p>Admin Panel खोलने के लिए Login करें।</p>

    <section class="option-card" style="max-width:450px; margin:30px auto;">

        <input

            id="adminId"
            placeholder="Admin ID"
            style="width:100%; padding:12px; margin-bottom:15px;"

        <input
            type="password"
            id="adminPassword"

<script>
    function adminLogin() {

        const adminPassword = document.getElementById("adminPassword").value;

        if (adminId === "SHIVANGI" && adminPassword === "Shivam@2007") {

            localStorage.setItem("shivamAdminLoggedIn", "true");

            window.location.href = "admin.html";
